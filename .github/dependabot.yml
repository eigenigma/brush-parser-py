version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The ref is the MSRV pin matching `rust-version` in Cargo.toml, not an
      # action version; it moves only when the MSRV does.
      - dependency-name: dtolnay/rust-toolchain
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
